name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: mcp
          POSTGRES_DB: mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp -d mcp"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mcp:mcp@localhost:5432/mcp
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Tests
        run: pnpm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mcp-server-starter .
